name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Protect source
        run: |
          mkdir -p /tmp/jarvis_keep/tool
          cp pubspec.yaml /tmp/jarvis_keep/pubspec.yaml
          cp lib/main.dart /tmp/jarvis_keep/main.dart 2>/dev/null || cp main.dart /tmp/jarvis_keep/main.dart
          cp tool/patch_android.py /tmp/jarvis_keep/tool/patch_android.py

      - name: Generate Android scaffold
        run: |
          rm -rf android
          flutter create \
            --project-name jarvis_assistant \
            --org org.londondistrict \
            --platforms=android \
            .

      - name: Restore source
        run: |
          cp /tmp/jarvis_keep/pubspec.yaml pubspec.yaml
          mkdir -p lib tool
          cp /tmp/jarvis_keep/main.dart lib/main.dart
          cp /tmp/jarvis_keep/tool/patch_android.py tool/patch_android.py

      - name: Patch Android (biometrics + notification listener)
        run: python3 tool/patch_android.py

      - name: Verify notification service in manifest
        run: |
          grep -n "NotificationListener" android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: build/app/outputs/flutter-apk/jarvis.apk
          retention-days: 30
