name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Protect our own files
        run: |
          mkdir -p .keep
          cp pubspec.yaml .keep/pubspec.yaml
          mkdir -p lib
          if [ -f lib/main.dart ]; then
            cp lib/main.dart .keep/main.dart
          else
            echo "ERROR: lib/main.dart missing" >&2
            exit 1
          fi

      - name: Generate Android scaffold
        run: |
          flutter create \
            --project-name jarvis_assistant \
            --org org.londondistrict \
            --platforms=android \
            .

      - name: Restore our own files
        run: |
          cp .keep/pubspec.yaml pubspec.yaml
          cp .keep/main.dart lib/main.dart
          rm -rf .keep

      - name: Patch manifest, minSdk, FragmentActivity
        run: python3 tool/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: build/app/outputs/flutter-apk/jarvis.apk
          retention-days: 30
